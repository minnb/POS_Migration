name: dotnet-tests

# Gate tu dong cho 2 vanh dai bao ve cua repo (xem CLAUDE.md muc "Guardrails & Testing" +
# .claude/skills/git-workflow/SKILL.md Buoc 2) — truoc day 2 project test nay CHI chay khi co
# nguoi/agent nho tu chay `dotnet test` truoc khi commit, khong duoc CI gate. Ca 2 project deu
# khong can Redis/SQL/Rabbit that (chi doc service descriptor / file tren dia), nen job nay khong
# can service container nao.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore POS.ContractTests
        run: dotnet restore tests/POS.ContractTests

      - name: Test POS.ContractTests
        run: dotnet test tests/POS.ContractTests --no-restore --configuration Release

      - name: Restore POS.UnitTests
        run: dotnet restore tests/POS.UnitTests

      - name: Test POS.UnitTests
        run: dotnet test tests/POS.UnitTests --no-restore --configuration Release
