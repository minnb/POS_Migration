# nginx reverse proxy config cho POS.Web (Blazor Server)
#
# Triển khai:
#   sudo cp pos-web.conf /etc/nginx/sites-available/pos-web
#   sudo ln -s /etc/nginx/sites-available/pos-web /etc/nginx/sites-enabled/pos-web
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # ── Timeout đủ dài cho SignalR Long Polling fallback (30 min) ──────────
    proxy_read_timeout    1800s;
    proxy_send_timeout    1800s;
    proxy_connect_timeout   30s;

    # ── Tăng buffer để tránh 502 khi Blazor trả payload lớn ───────────────
    # Production HTML (SSR + Blazor state) thường > 64KB → tăng lên 256KB
    proxy_buffer_size         32k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size   64k;

    # ── Dedicated block cho /_blazor SignalR hub (WebSocket) ─────────────
    # Đặt TRƯỚC location / để nginx match chính xác, không qua block chung
    location /_blazor {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;

        proxy_buffering    off;
        add_header         X-Accel-Buffering "no";  # tắt nginx internal buffer layer cho SSE/WS
        proxy_cache_bypass $http_upgrade;

        # WebSocket duy trì kết nối suốt session — không ngắt sau timeout idle
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
    }

    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # ── WebSocket upgrade — BẮT BUỘC cho Blazor Server SignalR ──────
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # ── Forward headers ───────────────────────────────────────────────
        # $http_host giữ nguyên Host header của browser kể cả port (34.21.209.178:8080)
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;

        proxy_cache_bypass $http_upgrade;
        proxy_buffering    off;
        add_header         X-Accel-Buffering "no";  # đồng nhất với /_blazor block
    }
}
