# nginx reverse proxy config cho POS.Web (Blazor Server)
#
# Triển khai:
#   sudo cp pos-web.conf /etc/nginx/sites-available/pos-web
#   sudo ln -s /etc/nginx/sites-available/pos-web /etc/nginx/sites-enabled/pos-web
#   sudo nginx -t && sudo systemctl reload nginx
#
# Kestrel port: kiểm tra bằng lệnh
#   ss -tlnp | grep dotnet
# Nếu app chạy với ASPNETCORE_URLS=http://+:5000 thì upstream là 127.0.0.1:5000

# Map $http_upgrade → $connection_upgrade:
#   - Có Upgrade header (WebSocket)  → "upgrade"
#   - Không có Upgrade header (HTTP)  → "close"
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # ── Timeout đủ dài cho SignalR Long Polling fallback (30 min) ──────────
    proxy_read_timeout    1800s;
    proxy_send_timeout    1800s;
    proxy_connect_timeout   30s;

    # ── Tăng buffer để tránh 502 khi Blazor trả payload lớn ───────────────
    proxy_buffer_size         16k;
    proxy_buffers           4 16k;
    proxy_busy_buffers_size   16k;

    location / {
        # !! Thay 5000 nếu Kestrel chạy ở port khác !!
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # ── WebSocket upgrade — BẮT BUỘC cho Blazor Server SignalR ──────
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # ── Forward headers để Kestrel biết IP/scheme thật ──────────────
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Tắt buffering cho SSE / streaming response
        proxy_buffering off;
    }
}
