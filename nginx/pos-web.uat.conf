# nginx reverse proxy config cho POS.Web UAT (Blazor Server)
#
# Clone từ pos-web.conf (production), đổi: listen port + proxy_pass upstream.
# Triển khai:
#   sudo cp pos-web.uat.conf /etc/nginx/sites-available/pos-web-uat
#   sudo ln -s /etc/nginx/sites-available/pos-web-uat /etc/nginx/sites-enabled/pos-web-uat
#   sudo nginx -t && sudo systemctl reload nginx
#
# LƯU Ý: proxy_pass phải trỏ đúng cổng Kestrel UAT đang bind (ví dụ 5002).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8081;          # cổng UAT (đổi theo hạ tầng)
    server_name _;        # đổi thành domain UAT nếu có

    # ── Timeout đủ dài cho SignalR Long Polling fallback (30 min) ──────────
    proxy_read_timeout    1800s;
    proxy_send_timeout    1800s;
    proxy_connect_timeout   30s;

    # ── Buffer đủ lớn cho Blazor SSR payload (256KB) ──────────────────────
    proxy_buffer_size         32k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size   64k;

    # ── Dedicated block cho /_blazor SignalR hub (WebSocket) ─────────────
    location /_blazor {
        proxy_pass         http://127.0.0.1:5002;   # ← cổng Kestrel UAT
        proxy_http_version 1.1;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        add_header         X-Accel-Buffering "no";
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
    }

    location / {
        proxy_pass         http://127.0.0.1:5002;   # ← cổng Kestrel UAT
        proxy_http_version 1.1;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;

        proxy_cache_bypass $http_upgrade;
        proxy_buffering    off;
        add_header         X-Accel-Buffering "no";
    }
}
