# Compose này CHỈ chạy API. SQL Server dùng container mssql_2019 CÓ SẴN trên server
# (quản lý bằng compose ở thư mục khác, publish port 14333:1433) — KHÔNG khai báo
# service sqlserver ở đây để tránh trùng container/tạo volume rỗng mất data.
# API kết nối SQL qua host.docker.internal,14333 (cấu hình trong appsettings.Production.json).
#
# Chạy: sudo docker compose up -d --build
# Trước lần chạy đầu: mkdir -p logs && sudo chown 1654:1654 logs
services:
  webapp:
    build: .
    container_name: sit_dotnet_api
    ports:
      - "8080:80"
    # SQL (14333), Redis (6379), RabbitMQ (5672) đều đi qua host.docker.internal
    # (Redis/RabbitMQ trên host phải listen 0.0.0.0 hoặc IP bridge 172.17.0.1)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g
    environment:
      ASPNETCORE_ENVIRONMENT: Production # dùng appsettings.Production.json
      DOTNET_gcServer: "0" # Workstation GC — hợp máy 2 vCPU / ít RAM
    volumes:
      # container chạy non-root APP_UID=1654 — không chown thư mục logs sẽ không ghi được file
      - ./logs:/app/logs
    restart: unless-stopped
