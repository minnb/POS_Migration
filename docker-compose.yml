# Compose DUY NHẤT cho cả API + SQL Server, chạy từ thư mục code:
#   sudo docker compose up -d --build
#
# QUAN TRỌNG — chuyển đổi MỘT LẦN từ container mssql_2019 cũ (GIỮ NGUYÊN DATA):
#   1. Xóa container cũ (DATA KHÔNG MẤT — data nằm trong volume my-sit-env_sql_data):
#        sudo docker rm -f mssql_2019
#   2. mkdir -p logs && sudo chown 1654:1654 logs
#   3. sudo docker compose up -d --build
#
# QUAN TRỌNG — chuyển đổi MỘT LẦN từ named volume ftpbluepos_data sang bind mount thư mục host
# thật (dễ cấp quyền/backup hơn) — xem hướng dẫn đầy đủ tại docs/deploy/ubuntu-guide.md:
#   1. sudo docker compose stop webapp pos-worker
#   2. sudo ./deploy/linux/setup-pos-dirs.sh
#   3. Di trú dữ liệu cũ từ named volume ftpbluepos_data sang /srv/pos/ftpbluepos (xem ubuntu-guide.md)
#   4. sudo docker compose up -d --build
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql_2019
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=VnDevops@2026! # Bạn có thể đổi mật khẩu này, nhưng giữ nguyên độ khó
      - MSSQL_PID=Developer # Bản Developer đầy đủ tính năng và miễn phí cho môi trường Test
      # Chặn SQL Server nuốt ~80% RAM máy 8GB (nguyên nhân phụ làm API chậm chờn)
      - MSSQL_MEMORY_LIMIT_MB=3072
      - TZ=Asia/Ho_Chi_Minh
    mem_limit: 4g
    ports:
      - "14333:1433" # cổng cho tools bên ngoài; API nối thẳng mssql_2019:1433 trong network
    volumes:
      - sql_data:/var/opt/mssql # Lưu trữ dữ liệu cứng để không mất DB khi khởi động lại
    healthcheck:
      # 2019-latest dùng mssql-tools; các bản CU mới dùng mssql-tools18 (cần thêm -C)
      test: [ "CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' || /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  webapp:
    build: .
    container_name: sit_dotnet_api
    ports:
      - "80:80"
    # Redis (6379) + RabbitMQ (5672) chạy native trên host → qua host.docker.internal
    # (Redis/RabbitMQ trên host phải listen 0.0.0.0 hoặc IP bridge 172.17.0.1)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sqlserver:
        condition: service_healthy
    mem_limit: 2g
    environment:
      ASPNETCORE_ENVIRONMENT: Production # dùng appsettings.Production.json
      DOTNET_gcServer: "0" # Workstation GC — hợp máy 2 vCPU / ít RAM
      # Khóa AES giải mã credentials enc:... trong appsettings (xem .env / .env.example).
      # Dùng CHUNG với POS.Web (cùng SecretProtector/AES key). Giá trị THẬT đặt trong .env
      # (đã .gitignore) — KHÔNG hardcode ở đây.
      POS_SECRET_KEY: ${POS_SECRET_KEY}
    volumes:
      # container chạy non-root APP_UID=1654 — không chown thư mục logs sẽ không ghi được file
      - ./logs:/app/logs
      # Root sync file (SOD/master-data zip, sale upload, log upload, upgrade tool) — bind mount thư
      # mục thật trên Ubuntu host (thay named volume ftpbluepos_data cũ) để ops truy cập trực tiếp
      # qua shell (ls/scp/chmod) thay vì phải chui vào /var/lib/docker/volumes. Việc quét file .zip
      # (PosFileImportWorker) giờ chạy dưới dạng cronjob thật trên host (Model A, ngoài compose này —
      # xem docs/deploy/pos-worker-ubuntu-guide.md), KHÔNG còn qua service `pos-worker` bên dưới.
      # Setup 1 lần trên host: deploy/linux/setup-pos-dirs.sh — xem docs/deploy/ubuntu-guide.md.
      - /srv/pos/ftpbluepos:/app/ftpbluepos
      # Giữ key DataProtection qua các lần rebuild — tắt cảnh báo "Storing keys in a
      # directory that may not be persisted" lúc khởi động
      - dp-keys:/home/app/.aspnet/DataProtection-Keys
    restart: unless-stopped

  # Model B — chạy dài hạn trong container: RabbitMQ consumer (PosSalesConsumerWorker) + SQL
  # polling (Rpt_ReportSaleDetail_Insert) + heartbeat. KHÔNG xử lý file (EnableFileProcessing=false)
  # — việc quét file .zip chung với webapp giờ chạy dưới dạng cronjob thật trên Ubuntu host (Model A,
  # "dotnet POS.Worker.dll --run-once" — xem docs/deploy/pos-worker-ubuntu-guide.md), nên container
  # này KHÔNG cần mount /srv/pos/ftpbluepos nữa.
  pos-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: pos_worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sqlserver:
        condition: service_healthy
    mem_limit: 512m
    environment:
      DOTNET_ENVIRONMENT: Production
      WorkerRoles__EnableFileProcessing: "false"
      WorkerRoles__EnableRabbitMQConsumer: "true"
      WorkerRoles__EnableSqlReportWorker: "true"
      WorkerRoles__EnableHeartbeat: "true"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  dp-keys:
  sql_data:
    # Dùng lại volume DATA CŨ của mssql_2019 (external — compose không tạo volume mới).
    # Mặc định: my-sit-env_sql_data (volume của compose cũ); có thể override qua .env nếu đổi server.
    external: true
    name: ${SQL_DATA_VOLUME:-my-sit-env_sql_data}
